server.port=8080
spring.application.name=donaciones-service
spring.threads.virtual.enabled=true

# Base de datos propia del servicio (PostgreSQL). Se puede sobreescribir con variables de entorno.
donaciones.db.driver=org.postgresql.Driver
donaciones.db.url=${DONACIONES_DB_URL:jdbc:postgresql://localhost:5432/donaciones}
donaciones.db.username=${DONACIONES_DB_USERNAME:postgres}
donaciones.db.password=${DONACIONES_DB_PASSWORD:postgres}
donaciones.db.dialect=org.hibernate.dialect.PostgreSQL10Dialect
donaciones.db.hbm2ddl=update
donaciones.db.show-sql=false
