server.port=8082
spring.application.name=notificaciones-service
spring.threads.virtual.enabled=true

notificaciones.db.driver=org.postgresql.Driver
notificaciones.db.url=${NOTIFICACIONES_DB_URL:jdbc:postgresql://localhost:5432/notificaciones}
notificaciones.db.username=${NOTIFICACIONES_DB_USERNAME:postgres}
notificaciones.db.password=${NOTIFICACIONES_DB_PASSWORD:postgres}
notificaciones.db.dialect=org.hibernate.dialect.PostgreSQL10Dialect
notificaciones.db.hbm2ddl=update
notificaciones.db.show-sql=false
resend.apiKey=${RESEND_API_KEY:mock-key}
resend.from=${RESEND_FROM:onboarding@resend.dev}
twilio.sid=${TWILIO_SID:AC00000000000000000000000000000000}
twilio.token=${TWILIO_TOKEN:mock-token}
twilio.smsNumber=${TWILIO_SMS_NUMBER:+1234567890}
twilio.whatsappNumber=${TWILIO_WHATSAPP_NUMBER:+1234567890}