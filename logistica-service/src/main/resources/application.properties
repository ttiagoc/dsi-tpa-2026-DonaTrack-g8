server.port=8081
spring.application.name=logistica-service
spring.threads.virtual.enabled=true

# Base de datos propia del servicio (PostgreSQL). Se puede sobreescribir con variables de entorno.
logistica.db.driver=org.postgresql.Driver
logistica.db.url=${LOGISTICA_DB_URL:jdbc:postgresql://localhost:5432/logistica}
logistica.db.username=${LOGISTICA_DB_USERNAME:postgres}
logistica.db.password=${LOGISTICA_DB_PASSWORD:postgres}
logistica.db.dialect=org.hibernate.dialect.PostgreSQL10Dialect
logistica.db.hbm2ddl=update
logistica.db.show-sql=false

# Cliente gRPC hacia donaciones-service
grpc.donaciones.host=${DONACIONES_GRPC_HOST:localhost}
grpc.donaciones.port=${DONACIONES_GRPC_PORT:9090}

# URLs de servicios y callback de planificacion de rutas
logistica.callback-url=${LOGISTICA_CALLBACK_URL:http://localhost:8081/api/rutas/planificaciones/resultados}
rest.notificaciones-url=${NOTIFICACIONES_API_URL:http://localhost:8082/api}
rest.donaciones-url=${DONACIONES_API_URL:http://localhost:8080/api}
rest.logistica-url=${LOGISTICA_API_URL:http://localhost:8081/api}