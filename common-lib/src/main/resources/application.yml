rest:
  donaciones-url: "http://localhost:8080/api"
  logistica-url: "http://localhost:8081/api"
  notificaciones-url: "http://localhost:8082/api"

# Secreto con el que se firman y validan los JWT (HS256, al menos 32 bytes). Tiene que ser el mismo en
# todos los servicios. El valor por defecto es solo para correr en local: en la nube se define JWT_SECRET.
jwt:
  secret: ${JWT_SECRET:donatrack-secreto-solo-para-desarrollo-local-0123456789}

# Clave compartida para las llamadas entre servicios (header X-Api-Key, rol SISTEMA).
# En la nube se define SERVICE_API_KEY con el mismo valor en donaciones y logistica.
seguridad:
  service-api-key: ${SERVICE_API_KEY:donatrack-clave-servicios-local}
