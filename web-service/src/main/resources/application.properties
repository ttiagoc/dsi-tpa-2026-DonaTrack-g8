server.port=${PORT:7070}
spring.application.name=web-service
spring.threads.virtual.enabled=true

# URLs base de las APIs que consume el cliente liviano
web.api.donaciones-url=${DONACIONES_API_URL:http://localhost:8080/api}
web.api.logistica-url=${LOGISTICA_API_URL:http://localhost:8081/api}
web.api.notificaciones-url=${NOTIFICACIONES_API_URL:http://localhost:8082/api}

# Cookie de sesion: Secure solo en la nube (en local se usa http)
web.sesion.cookie-segura=${COOKIE_SECURE:false}
web.sesion.minutos-inactividad=${SESION_MINUTOS_INACTIVIDAD:120}
